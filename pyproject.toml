[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpacket"
version = "0.1.0"
description = "Review AI work against recorded evidence."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
proofpacket = "proofpacket.__main__:main"

[tool.setuptools.packages.find]
include = ["proofpacket*"]
